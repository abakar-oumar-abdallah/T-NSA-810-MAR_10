# HashiCorp Vault — Configuration deployée sur VM-S1-03 (192.168.10.103)

# Voir /etc/vault/vault-config.hcl sur la VM
storage "file" {
  path = "/var/lib/vault/data"
}

listener "tcp" {
  address     = "0.0.0.0:8200"
  tls_disable = 1
}

api_addr = "http://192.168.10.103:8200"
ui = true

